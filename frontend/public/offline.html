<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0284c7">
    <title>TripSync is offline</title>
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{max-width:28rem;margin:1.5rem;padding:2rem;border-radius:1rem;background:#fff;box-shadow:0 10px 30px #0f172a1a;text-align:center}.mark{width:3rem;height:3rem;margin:0 auto 1rem;display:grid;place-items:center;border-radius:.9rem;background:#0284c7;color:#fff;font-size:1.5rem}button{border:0;border-radius:.6rem;background:#0284c7;color:#fff;padding:.7rem 1rem;font:inherit;font-weight:600;cursor:pointer}</style>
  </head>
  <body>
    <main class="card"><div class="mark">⌁</div><h1>You’re offline</h1><p>TripSync needs a connection to load your current group and expense data securely. Please reconnect and try again.</p><button onclick="location.reload()">Try again</button></main>
  </body>
</html>
